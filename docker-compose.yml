services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: streamio
      POSTGRES_PASSWORD: streamio
      POSTGRES_DB: streamio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "streamio"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://streamio:streamio@postgres/streamio
      REDIS_URL: redis://redis/
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      # OIDC provider (Entra ID, Google, Okta, etc.)
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET}"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-http://localhost:8080/auth/callback}"
      GATEWAY_PORT: "8080"
      GATEWAY_ORIGIN: "${GATEWAY_ORIGIN:-http://localhost:8080}"
      # Comma-separated OIDC subject IDs or group IDs with admin role
      ADMIN_SUBS: "${ADMIN_SUBS:-}"
      RUST_LOG: "${RUST_LOG:-streamio_gateway=info,tower_http=info}"

volumes:
  postgres_data:
