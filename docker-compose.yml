services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: streamio
      POSTGRES_PASSWORD: streamio
      POSTGRES_DB: streamio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "streamio"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://streamio:streamio@postgres/streamio
      REDIS_URL: redis://redis/
      JWT_SECRET: "${JWT_SECRET:-streamio-jwt-secret-change-in-prod}"
      # Entra ID (Azure AD) OIDC
      OIDC_ISSUER_URL: "https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET}"
      OIDC_REDIRECT_URI: "${GATEWAY_ORIGIN}/auth/callback"
      GATEWAY_PORT: "8080"
      GATEWAY_ORIGIN: "${GATEWAY_ORIGIN}"
      ADMIN_SUBS: "${ADMIN_GROUP_ID}"
      RUST_LOG: "streamio_gateway=debug,tower_http=debug"

volumes:
  postgres_data:
