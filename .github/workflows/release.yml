name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ github.ref_name }} already exists, skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No existing release for ${{ github.ref_name }}, proceeding with build."
          fi

  build-macos:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: macos-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GStreamer
        run: brew install gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugins-ugly libnice-gstreamer pkgconf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Bundle
        run: chmod +x bundle.sh && ./bundle.sh

      - name: Import certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Sign binary and libraries
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          IDENTITY="Developer ID Application: Yashwant Singh ($APPLE_TEAM_ID)"
          echo "Signing with: $IDENTITY"

          # Sign all dylibs and plugins first (inside out)
          find dist/lib -type f \( -name "*.dylib" -o -name "*.so" \) | while read f; do
            codesign --force --options runtime --sign "$IDENTITY" "$f"
          done

          # Sign plugin scanner
          if [ -f dist/libexec/gst-plugin-scanner ]; then
            codesign --force --options runtime --sign "$IDENTITY" dist/libexec/gst-plugin-scanner
          fi

          # Sign main binary
          codesign --force --options runtime --sign "$IDENTITY" dist/streamio

          echo "Verifying signature..."
          codesign -vvv dist/streamio

      - name: Create archives
        run: |
          ditto -c -k --keepParent dist streamio-macos-arm64.zip
          tar czf streamio-macos-arm64.tar.gz -C dist .

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            echo "Submitting for notarization..."
            xcrun notarytool submit streamio-macos-arm64.zip \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait
            echo "Notarization complete."
          else
            echo "Skipping notarization (secrets not configured)."
          fi

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamio-macos-arm64
          path: streamio-macos-arm64.tar.gz

  build-linux:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-nice libnice-dev \
            libx11-dev libxtst-dev libxdo-dev \
            patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Bundle
        run: chmod +x bundle.sh && ./bundle.sh

      - name: Create tarball
        run: tar czf streamio-linux-x86_64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamio-linux-x86_64
          path: streamio-linux-x86_64.tar.gz

  build-windows:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GStreamer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $GST_VERSION = "1.26.11"
          $BASE = "https://gstreamer.freedesktop.org/data/pkg/windows/$GST_VERSION/msvc"
          $RT = "gstreamer-1.0-msvc-x86_64-$GST_VERSION.msi"
          $DEV = "gstreamer-1.0-devel-msvc-x86_64-$GST_VERSION.msi"
          $GST_ROOT = "C:\gstreamer\1.0\msvc_x86_64"

          Write-Host "Downloading GStreamer runtime..."
          curl.exe -fSL --retry 3 -o "$env:TEMP\$RT" "$BASE/$RT"
          if ($LASTEXITCODE -ne 0) { throw "Download failed" }
          Write-Host "Downloading GStreamer devel..."
          curl.exe -fSL --retry 3 -o "$env:TEMP\$DEV" "$BASE/$DEV"
          if ($LASTEXITCODE -ne 0) { throw "Download failed" }

          # Extract MSIs using 7z (msiexec /quiet fails silently on CI runners)
          $7z = "C:\Program Files\7-Zip\7z.exe"
          $extractDir = "$env:TEMP\gst-extract"
          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null

          Write-Host "Extracting runtime MSI..."
          & $7z x "$env:TEMP\$RT" -o"$extractDir\rt" -y | Select-String "Everything is Ok"
          Write-Host "Extracting devel MSI..."
          & $7z x "$env:TEMP\$DEV" -o"$extractDir\dev" -y | Select-String "Everything is Ok"

          # MSI extracts with internal directory structure — find the GStreamer root
          # The files are under a path like: Program Files/gstreamer/1.0/msvc_x86_64/
          $rtRoot = Get-ChildItem "$extractDir\rt" -Recurse -Filter "gstreamer-1.0.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($rtRoot) {
            $srcRoot = $rtRoot.Directory.Parent.FullName  # go up from bin/
            Write-Host "Found runtime at: $srcRoot"
          } else {
            # Try finding by directory structure
            $srcRoot = Get-ChildItem "$extractDir\rt" -Recurse -Directory -Filter "msvc_x86_64" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($srcRoot) { $srcRoot = $srcRoot.FullName; Write-Host "Found runtime dir: $srcRoot" }
          }

          $devRoot = Get-ChildItem "$extractDir\dev" -Recurse -Filter "glib-2.0.pc" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($devRoot) {
            $devSrc = $devRoot.Directory.Parent.Parent.FullName  # go up from lib/pkgconfig/
            Write-Host "Found devel at: $devSrc"
          }

          # Copy to expected location
          New-Item -ItemType Directory -Path $GST_ROOT -Force | Out-Null
          if ($srcRoot -and (Test-Path $srcRoot)) {
            Write-Host "Copying runtime..."
            Copy-Item "$srcRoot\*" $GST_ROOT -Recurse -Force
          }
          if ($devSrc -and (Test-Path $devSrc)) {
            Write-Host "Copying devel..."
            Copy-Item "$devSrc\*" $GST_ROOT -Recurse -Force
          }

          # Verify
          if (Test-Path "$GST_ROOT\lib\pkgconfig\glib-2.0.pc") {
            Write-Host "GStreamer installed successfully at $GST_ROOT"
            Get-ChildItem "$GST_ROOT\lib\pkgconfig" -Filter "gst*" | Select-Object -First 5
          } else {
            Write-Host "ERROR: glib-2.0.pc not found after extraction"
            Write-Host "=== Extract dir structure ==="
            Get-ChildItem $extractDir -Recurse -Depth 5 | Select-Object -First 40
            throw "GStreamer installation failed"
          }

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        shell: cmd
        run: |
          set PATH=C:\gstreamer\1.0\msvc_x86_64\bin;%PATH%
          set PKG_CONFIG=C:\Strawberry\perl\bin\pkg-config.bat
          set PKG_CONFIG_PATH=C:\gstreamer\1.0\msvc_x86_64\lib\pkgconfig
          cargo build --release -p streamio

      - name: Bundle
        shell: powershell
        run: |
          $GST = "C:\gstreamer\1.0\msvc_x86_64"
          $DIST = "$env:GITHUB_WORKSPACE\dist-windows"
          $GST_PLUGINS = "$GST\lib\gstreamer-1.0"

          New-Item -ItemType Directory -Path "$DIST\lib\gstreamer-1.0" -Force | Out-Null
          Copy-Item "target\release\streamio.exe" $DIST

          $plugins = @(
            'gstcoreelements','gstapp','gstvideoconvertscale','gstvideorate',
            'gstvideoparsersbad','gsttypefindfunctions',
            'gstrtp','gstrtpmanager','gstwebrtc','gstnice',
            'gstdtls','gstsrtp','gstsctp','gstsdpelem',
            'gstopus','gstaudioconvert','gstaudioresample',
            'gstd3d11','gstwasapi','gstwasapi2','gstmediafoundation',
            'gstnvcodec'
          )

          foreach ($p in $plugins) {
            $f = Get-ChildItem $GST_PLUGINS -Filter "$p.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($f) {
              Copy-Item $f.FullName "$DIST\lib\gstreamer-1.0\"
              Write-Host "  plugin: $($f.Name)"
            } else {
              Write-Host "  MISSING (optional): $p"
            }
          }

          Get-ChildItem "$GST\bin" -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName $DIST
          }

          $size = (Get-ChildItem $DIST -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("Bundle size: {0:F1} MB" -f $size)

      - name: Create archive
        run: tar czf streamio-windows-x86_64.tar.gz -C dist-windows .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamio-windows-x86_64
          path: streamio-windows-x86_64.tar.gz

  release:
    needs: [check, build-macos, build-linux, build-windows]
    if: always() && needs.check.outputs.exists != 'true' && (needs.build-macos.result == 'success' || needs.build-linux.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: streamio-*.tar.gz
