[package]
name = "streamio-session-manager"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "streamio-session-manager"
path = "src/main.rs"

[dependencies]
streamio-types = { path = "../types" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web server (REST API for gateway)
axum = { version = "0.7", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
